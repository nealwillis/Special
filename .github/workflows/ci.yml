name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (app and serverless API)
        run: npm run typecheck
      - name: Unit, API and screen tests
        run: npx jest --ci
      - name: Build the web export Vercel deploys
        run: npm run build:web
